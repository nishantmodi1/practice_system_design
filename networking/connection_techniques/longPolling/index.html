<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Long Polling</h1>
  <div id="data-container"></div>
</body>

<script>

  async function getData(lastData) {
    try {
      const response = await fetch(`/getData?lastData=${lastData}`)
      const result = await response.json() //use .json to parse the response as JSON or desrialize the response as JSON
      document.getElementById('data-container').innerText = result.data
      getData(result.data)
    } catch (error) {
      console.error('Error fetching data:', error);

    }
  }
  getData()
</script>
</html>
